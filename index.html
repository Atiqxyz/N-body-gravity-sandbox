<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>N-Body Astrophysical Workstation v4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui">
        <div class="header">
            <h3>Exotic Sandbox</h3>
            <div class="sub-title">SYS-ID: 884-OMEGA v4.0</div>
        </div>
        
        <p class="instruction">[DRAG] to vector launch</p>
        
        <div class="btn-group">
            <button id="spawnBtn" class="action-btn glow-blue">⚡ INJECT BODY</button>
            <button id="binaryBtn" class="action-btn glow-gold">⚇ BINARY</button>
        </div>
        
        <div class="btn-group">
            <button id="darkMatterBtn" class="action-btn glow-purple">🌌 DARK MATTER</button>
        </div>

        <div class="btn-group">
            <button id="pauseBtn" class="action-btn half-btn">⏸ PAUSE</button>
            <button id="resetBtn" class="action-btn half-btn glow-red">⟲ RESET</button>
        </div>

        <div id="control-group">
            <label>MASS INJECTION (M☉):</label>
            <div class="input-row">
                <input type="range" id="massSlider" min="5" max="75000" value="100">
                <input type="number" id="massNumber" min="5" max="75000" value="100">
            </div>
        </div>

        <div id="legend">
            <div class="legend-col">
                <div><span style="color: #718096;">■</span> &lt; 1k: Planet</div>
                <div><span style="color: #4a90e2;">■</span> &lt; 3k: Gas Giant</div>
                <div><span style="color: #ff3333;">■</span> &lt; 5k: Br. Dwarf</div>
                <div><span style="color: #ff4500;">■</span> &lt; 15k: Red Dwarf</div>
            </div>
            <div class="legend-col">
                <div><span style="color: #ffcc00;">■</span> &lt; 30k: Star</div>
                <div><span style="color: #0088ff;">■</span> &lt; 40k: Blue Giant</div>
                <div><span style="color: #b026ff;">■</span> &lt; 50k: Pulsar</div>
                <div><span style="color: #000; text-shadow: 0 0 3px #fff;">■</span> &gt; 50k: Black Hole</div>
            </div>
        </div>

        <div id="telemetry">
            <div>BODIES: <span id="statBodies">1</span></div>
            <div>SYS MASS: <span id="statMass">10,000</span></div>
            <div>STATUS: <span id="statStatus">ACTIVE</span></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
